name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and production bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Diagnóstico de vulnerabilidades npm (JSON)
        run: npm audit --json || test "$?" -eq 1
      - name: Typecheck
        run: npm run typecheck
      - name: Build local agent
        run: npm run agent:build
      - name: Build native host
        run: npm run host:build
      - name: Build extension
        run: npm run ext:build
      - name: Test
        run: npm test
      - name: Regressões de coleta e dashboard
        run: node --test scripts/regression-3109.test.mjs
      - name: Auditoria estática
        run: npm run audit
      - name: Smoke local
        run: npm run smoke:local
      - name: Smoke de publicação assistida
        run: npm run audit:publish
      - name: Integridade do schema
        run: npm run db:generate -- --check
