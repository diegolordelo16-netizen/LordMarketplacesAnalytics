name: CI

on:
  push:
    branches: [master, 'validation/**']
  pull_request:
    branches: [master, 'validation/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and production bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Auditoria de dependências npm
        run: npm audit --audit-level=low
      - name: Typecheck
        run: npm run typecheck
      - name: Build local agent
        run: npm run agent:build
      - name: Build native host
        run: npm run host:build
      - name: Build extension
        run: npm run ext:build
      - name: Test
        run: npm test
      - name: Regressões de coleta e dashboard
        run: node --test scripts/regression-3109.test.mjs
      - name: Auditoria estática
        run: npm run audit
      - name: Smoke local
        run: npm run smoke:local
      - name: Smoke de publicação assistida
        run: npm run audit:publish
      - name: Integridade do schema
        run: npm run db:generate -- --check

      - name: Testes do atualizador de versões
        run: node --test installer/scripts/update-manager.test.mjs
      - name: Preparar payload validado para atualização
        run: |
          mkdir -p update-payload
          cp -R dist/local-agent dist/native-host dist/extension update-payload/
          node installer/scripts/update-manager.mjs manifest update-payload "$(node -p "require('./package.json').version")" "$GITHUB_SHA"
          sha256sum update-payload/update-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: MarketplaceIntelligence-validated-update
          path: update-payload/
          if-no-files-found: error

  windows-upgrade:
    name: Windows installer and actual update/rollback smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run agent:build
      - run: npm run host:build
      - run: npm run ext:build
      - run: node --test installer/scripts/update-manager.test.mjs
      - name: Install, boot and rollback real built service in temporary Windows directories
        run: node installer/scripts/update-windows-smoke.mjs
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package Windows installer
        env:
          ISCC_PATH: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
        run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: MarketplaceIntelligence-Windows-candidate
          path: installer/output/MarketplaceIntelligence-Setup.exe
          if-no-files-found: error
